name: Community-Apps
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Verify independent download configuration
        run: node scripts/verify-isolation.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build independent Community Edition
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm --filter @ordo/desktop tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify bundled frontend has no operator services
        run: node scripts/verify-isolation.mjs --built
      - name: Stage installers
        shell: bash
        run: |
          mkdir -p release-artifacts
          find apps/desktop/src-tauri/target -type f \( -name '*-setup.exe' -o -name '*.dmg' \) -exec cp {} release-artifacts/ \;
      - name: Keep build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: community-${{ matrix.os }}
          path: release-artifacts/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "Ordo Community $RELEASE_TAG" --notes "Unabhängige Community-Ausgabe aus dem öffentlichen Quellcode. Ohne private Betreiber-Datenbank und ohne privaten Updatekanal. Hinweise und Selbsthosting-Anleitung im README." || gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
