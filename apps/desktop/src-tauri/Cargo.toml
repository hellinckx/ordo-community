[package]
name = "ordo"
version = "0.4.5"
description = "Ordo – Buchhaltung, Projekte und Lager an einem Ort."
authors = ["Hellinckx Process Simulation e.U."]
edition = "2021"
rust-version = "1.80"

[lib]
name = "ordo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
notify-debouncer-mini = "0.5"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tiny_http = "0.12"
ureq = "2"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
