# Ordo web app behind nginx (see SELFHOST.md).
# Note: an add_header inside a location replaces the server-level ones, so the security headers are repeated there.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  location = /app { return 301 /app/; }

  # service worker and manifest must never be cached stale, or people keep an old app version
  location ~ ^/(app/)?(sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri =404;
  }

  location /app/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri =404;
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  location = / { return 302 /app/; }
}
